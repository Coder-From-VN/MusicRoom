name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  AZURE_WEBAPP_NAME: "your-app-name-here"
  PUBLISH_DIR: "${{ github.workspace }}/publish"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MusicRoom.sln

      - name: Build
        run: dotnet build MusicRoom.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicRoom.sln --no-build --configuration Release --verbosity normal

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/MusicRoom/MusicRoom.csproj --configuration Release --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Somee.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          local-dir: publish/
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/*.pdb
