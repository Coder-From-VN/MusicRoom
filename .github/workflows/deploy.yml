name: Build, Test & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "8.0.x"
  PUBLISH_DIR: "${{ github.workspace }}/publish"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MusicRoom.sln

      - name: Build
        run: dotnet build MusicRoom.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MusicRoom.sln --configuration Release --no-build --verbosity normal

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/MusicRoom/MusicRoom.csproj --configuration Release --output ${{ env.PUBLISH_DIR }}

      - name: Create app_offline marker (local)
        run: |
          mkdir -p "${{ github.workspace }}/app_offline_temp"
          cat > "${{ github.workspace }}/app_offline_temp/app_offline.htm" <<'EOF'
          <html><head><title>Maintenance</title></head><body><h1>Maintenance — Deploying update</h1></body></html>
          EOF

      - name: Upload app_offline.htm to take app offline
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          local-dir: ${{ github.workspace }}/app_offline_temp/
          state-name: .ftp-deploy-sync-state-offline-${{ github.run_id }}.json
          dangerous-clean-slate: false
          log-level: verbose

      - name: Wait for app to shut down
        run: sleep 20

      - name: Deploy published files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          local-dir: ${{ env.PUBLISH_DIR }}/
          state-name: .ftp-deploy-sync-state-main.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/*.pdb
            **/.DS_Store
            **/appsettings.Development.json
          log-level: verbose

      - name: Remove app_offline.htm (bring app online)
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.SOMEE_FTP_USERNAME }},${{ secrets.SOMEE_FTP_PASSWORD }}" "${{ secrets.SOMEE_FTP_SERVER }}" -e "
            cd ${{ secrets.SOMEE_FTP_SERVER_DIR }};
            rm -f app_offline.htm 2>/dev/null || true;
            bye
          "