name: Build, Test, Play Doom & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  PUBLISH_DIR: "${{ github.workspace }}/publish"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MusicRoom.sln

      - name: Build
        run: dotnet build MusicRoom.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicRoom.sln --no-build --configuration Release --verbosity normal

  play-doom:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      died: ${{ steps.rip.outputs.died }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Clone doomgeneric
        run: git clone --depth 1 https://github.com/ozkl/doomgeneric.git

      - name: Get Freedoom IWAD (free, open-licensed)
        run: |
          curl -L -o freedoom.zip \
            https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
          unzip freedoom.zip -d freedoom
          cp freedoom/freedoom-0.13.0/freedoom1.wad doomgeneric/doomgeneric/doom1.wad

      - name: Add ASCII terminal renderer + death hook
        run: |
          cp .ci/doomgeneric_term.c doomgeneric/doomgeneric/
          sed -i '/P_KillMobj/,/{/{ /{/a\    if (target->player) printf("::PLAYER_DIED::\\n");
          }' doomgeneric/doomgeneric/p_inter.c

      - name: Build (headless — no SDL needed)
        run: |
          cd doomgeneric/doomgeneric
          gcc -O2 -o doomgeneric *.c -lm

      - name: Play until death (or timeout)
        id: rip
        run: |
          cd doomgeneric/doomgeneric
          set +e
          timeout 300 ./doomgeneric -iwad doom1.wad -skill 4 2>&1 | tee run.log
          if grep -q "::PLAYER_DIED::" run.log; then
            echo "died=true" >> "$GITHUB_OUTPUT"
          else
            echo "died=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [build-and-test, play-doom]
    if: needs.play-doom.outputs.died == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/MusicRoom/MusicRoom.csproj --configuration Release --output ${{ env.PUBLISH_DIR }}

      - name: Create app_offline marker (local)
        run: |
          mkdir -p "${{ github.workspace }}/app_offline_temp"
          cat > "${{ github.workspace }}/app_offline_temp/app_offline.htm" <<'EOF'
          <html><head><title>Maintenance</title></head><body><h1>Maintenance — Deploying update</h1></body></html>
          EOF

      - name: Upload app_offline.htm to take app offline
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          local-dir: ${{ github.workspace }}/app_offline_temp/
          state-name: .ftp-deploy-sync-state-offline.json
          dangerous-clean-slate: false
          log-level: verbose

      - name: Deploy published files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          local-dir: ${{ env.PUBLISH_DIR }}/
          state-name: .ftp-deploy-sync-state-main.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/*.pdb
            **/.DS_Store
            **/appsettings.Development.json
          log-level: verbose

      - name: Remove app_offline.htm (bring app online)
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.SOMEE_FTP_USERNAME }},${{ secrets.SOMEE_FTP_PASSWORD }}" "${{ secrets.SOMEE_FTP_SERVER }}" -e "cd ${{ secrets.SOMEE_FTP_SERVER_DIR }}; rm app_offline.htm; bye"